<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Salone Sales">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset in="blur" dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- SL flag mark, centered -->
  <g transform="translate(116 116)" filter="url(#shadow)">
    <rect x="0"   y="0"   width="280" height="93"  rx="14" fill="#1eb53a"/>
    <rect x="0"   y="93"  width="280" height="94"           fill="#ffffff"/>
    <rect x="0"   y="187" width="280" height="93"  rx="0"  fill="#0072c6"/>
    <rect x="0"   y="0"   width="280" height="280" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  </g>

  <!-- "S" monogram overlay -->
  <text x="256" y="478" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="40" font-weight="700" letter-spacing="-1"
        fill="rgba(255,255,255,0.92)">SALONE</text>
</svg>
